# Quality gates from AGENTS.md §5. Every PR into dev or main must pass both jobs.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Health check
        run: |
          uvicorn app.main:app --port 8000 &
          curl --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8000/health | grep -q '"status":"ok"'

  app:
    name: App (types + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # The steps below switch on by themselves once the app adds their config,
      # so CI never fails for tooling the frontend has not set up yet.
      - name: Format check
        if: hashFiles('app/.prettierrc*', 'app/prettier.config.*') != ''
        run: npx prettier --check .
      - name: Lint
        if: hashFiles('app/eslint.config.*', 'app/.eslintrc*') != ''
        run: npx expo lint
      - name: Tests
        run: npm test --if-present -- --coverage
